services:
  db:
    image: postgres:16-alpine
    container_name: weekly-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weekly_user
      POSTGRES_PASSWORD: weekly_password
      POSTGRES_DB: weekly_report_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_user -d weekly_report_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
